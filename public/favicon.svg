<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Outer circle (magnifying glass lens) -->
  <circle cx="28" cy="28" r="22" fill="none" stroke="#4F46E5" stroke-width="5"/>
  
  <!-- Compass needle pointing N-E-S-W (searching everywhere) -->
  <polygon points="28,10 32,28 28,46 24,28" fill="#4F46E5"/>
  
  <!-- Cardinal direction ticks -->
  <line x1="28" y1="6" x2="28" y2="12" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
  <line x1="28" y1="44" x2="28" y2="50" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
  <line x1="6" y1="28" x2="12" y2="28" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
  <line x1="44" y1="28" x2="50" y2="28" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Magnifying glass handle -->
  <line x1="44" y1="44" x2="56" y2="56" stroke="#4F46E5" stroke-width="6" stroke-linecap="round"/>
</svg>